name: Build Mac App

# Builds an unsigned (ad-hoc) Atoll.app on a GitHub macOS runner and uploads it
# as a downloadable artifact, so no local Xcode install is needed.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/atoll-mac-changes

jobs:
  build-app:
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download Metal Toolchain
        run: |
          sudo xcodebuild -runFirstLaunch || true
          for i in 1 2 3 4 5; do
            sudo xcodebuild -downloadComponent MetalToolchain && break
            sleep 10
          done

      - name: Build
        run: |
          # Strip mach-services entitlement (amfid kills ad-hoc signed apps).
          plutil -remove com.apple.security.mach-services DynamicIsland/DynamicIsland.entitlements 2>/dev/null || true

          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES

      - name: Package app
        run: |
          APP=$(find build/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Atoll-mac.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-mac-app
          path: Atoll-mac.zip
          retention-days: 14
